[tox]
# Test against all currently supported Django versions and officially supported
# combinations of Python and Django versions.
envlist =
    {py310,py311,py312,py313,py314}-django{52}
    {py312,py313,py314}-django{60,61}
    py312-checks
#skipsdist = true
skip_missing_interpreters = true
isolated_build = true

[testenv]
usedevelop = false
setenv =
    IGNORE_ENV_FILE=true
    SECRET_KEY="For testing only!"
    SITE_ID=1
commands =
    python manage.py collectstatic --noinput
    python -Wa manage.py test --noinput --verbosity=2
    python manage.py validate_templates
deps =
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<7.0
    django_extensions
    django-environ
    pytest
    pytest-django
    django-tinymce

[testenv:py312-checks]
basepython=python3.12
usedevelop=true
commands =
    ; Check template syntax
    python manage.py validate_templates
    ; Check whether you forgot to run makemigrations after changing models
    python manage.py makemigrations --no-input --dry-run --check
deps =
    Django>=5.2,<6.0
    django-environ
    django_extensions

[coverage:run]
# Measure branch coverage as well as statement coverage
branch = true
# Ignore migrations and test files, inflates the coverage %
# NOTE: Paths are relative to the manage.py dir
omit =
    test_project/**
    **/migrations/*
    tests/**

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314
