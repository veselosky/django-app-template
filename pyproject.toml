[project]
name = "django-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vince Veselosky", email = "vince@control-escape.com" }
]
requires-python = ">=3.10"
dependencies = [
    "django>=5.2.17,<6.3",
]

[dependency-groups]
dev =[
    "coverage>=7.16.2",
    "django-environ>=0.14.0",
    "django-extensions>=4.1",
    "django-debug-toolbar>=8.0.0",
    "djlint>=1.46.4",
    "ipython>=8.37",
    "pre-commit>=4.6.2",
    "ruff>=0.16.10",
    "tox>=4.64.8",
    "tox-uv>=1.36.1",
    "rich>=15.0.0",
]

[build-system]
# With setuptools-scm, package data files (e.g. templates) that are tracked by git will
# be automatically detected and included. Without setuptools-scm, you would need to
# specify a file pattern in MANIFEST.in to collect them.
requires = ["setuptools>=66.1.1", "setuptools-scm>=7.0.5", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "DJ",   # flake8-django
    "LOG",  # flake8-logging
    "T20",  # flake8-print
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501"]
"manage.py" = ["E402"]
"*/celery.py" = ["T201"]  # Allow print in debug tasks
